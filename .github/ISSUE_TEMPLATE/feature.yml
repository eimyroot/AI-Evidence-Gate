name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the bounded behavior and expected release/evidence impact.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Evaluation, release, or security considerations
