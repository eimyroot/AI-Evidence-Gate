services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiql
      POSTGRES_USER: aiql
      POSTGRES_PASSWORD: aiql
    volumes:
      - aiql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiql -d aiql"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aiql:aiql@db:5432/aiql
      AIQL_DEMO_SEED: "true"
      AIQL_ALLOW_REAL_PROVIDERS: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aiql_pgdata:
